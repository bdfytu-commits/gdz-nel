name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v4

      - name: Проверить данные (jsonschema)
        run: |
          python3 -m pip install --quiet jsonschema
          python3 scripts/validate_data.py

      - name: Собрать статику в _site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='android-twa' \
            --exclude='android-signing' \
            ./ _site/
          touch _site/.nojekyll

      - name: Подготовить Pages
        uses: actions/configure-pages@v5

      - name: Загрузить артефакт
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
