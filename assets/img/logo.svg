<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Эмблема НЭЛ">
  <!-- заглушка эмблемы: бирюзовая обводка, синяя птица, столбики диаграммы.
       заменить настоящей эмблемой лицея, сохранив имя файла -->
  <circle cx="60" cy="60" r="55" fill="#ffffff" stroke="#1AA3A3" stroke-width="6"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="#1AA3A3" stroke-width="1.5" opacity="0.45"/>
  <!-- столбики диаграммы -->
  <rect x="36" y="62" width="13" height="24" rx="2" fill="#E53935"/>
  <rect x="53.5" y="52" width="13" height="34" rx="2" fill="#16A085"/>
  <rect x="71" y="42" width="13" height="44" rx="2" fill="#F5C518"/>
  <!-- птица -->
  <g transform="translate(0 -8)">
    <path fill="none" stroke="#0070C0" stroke-width="5" stroke-linecap="round" d="M32 41 Q 45 24 58 36 M62 36 Q 75 24 88 41"/>
    <circle cx="60" cy="38" r="4.5" fill="#0070C0"/>
  </g>
</svg>
