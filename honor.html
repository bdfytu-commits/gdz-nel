<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Доска почёта — ГДЗ НЭЛ</title>
  <meta name="description" content="Доска почёта ГДЗ НЭЛ: короткие объявления, благодарности и новости проекта. Лайкай лучшие записи.">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ГДЗ НЭЛ">
  <meta property="og:title" content="Доска почёта — ГДЗ НЭЛ">
  <meta property="og:description" content="Благодарности, объявления и лучшие моменты проекта ГДЗ НЭЛ. Читай и ставь сердечки.">
  <meta property="og:url" content="https://gdz-nel.pages.dev/honor.html">
  <meta property="og:image" content="https://gdz-nel.pages.dev/assets/img/screens/landing-1440.png">
  <meta property="og:locale" content="ru_RU">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Доска почёта — ГДЗ НЭЛ">
  <meta name="twitter:description" content="Благодарности, объявления и лучшие моменты проекта ГДЗ НЭЛ.">
  <meta name="twitter:image" content="https://gdz-nel.pages.dev/assets/img/screens/landing-1440.png">
  <link rel="canonical" href="https://gdz-nel.pages.dev/honor.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/img/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0B0B0F">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .honor-page {
      --hb-bg: #F2FBFA;
      --hb-card: #FFFFFF;
      --hb-text: #123236;
      --hb-muted: #5D7478;
      --hb-line: #D5E9E7;
      --hb-teal: #128080;
      --hb-teal-dark: #0B5F63;
      --hb-mint: #D9F4EF;
      background:
        radial-gradient(circle at 8% 0, rgba(26,163,163,.15), transparent 32rem),
        radial-gradient(circle at 100% 18%, rgba(0,112,192,.09), transparent 30rem),
        var(--hb-bg);
      color: var(--hb-text);
      min-height: 100vh;
    }
    .honor-page .site-header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(242,251,250,.86);
      border-bottom: 1px solid var(--hb-line);
      backdrop-filter: blur(14px);
    }
    .honor-page .brand-name, .honor-page .site-nav a { color: var(--hb-text); }
    .honor-page .site-nav a[aria-current="page"] { color: var(--hb-teal); }
    .honor-main { max-width: 760px; margin: 0 auto; padding: 34px 18px 90px; }
    .honor-hero { padding: 16px 4px 26px; }
    .honor-kicker {
      display: inline-flex; align-items: center; gap: 9px;
      color: var(--hb-teal); font: 700 11px/1 var(--font-head);
      letter-spacing: .1em; text-transform: uppercase;
    }
    .honor-kicker::before { content: ""; width: 26px; height: 3px; border-radius: 3px; background: var(--hb-teal); }
    .honor-hero h1 {
      margin: 14px 0 9px; color: var(--hb-text);
      font: 700 clamp(31px, 6vw, 50px)/1.08 var(--font-head);
      letter-spacing: -.03em;
    }
    .honor-hero p { margin: 0; max-width: 590px; color: var(--hb-muted); font-size: 15px; }
    .honor-feed {
      display: grid; gap: 18px;
      padding: 4px 2px 30px;
      scrollbar-width: thin;
      scrollbar-color: #9CCFCA transparent;
    }
    .honor-card {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; justify-content: space-between;
      min-height: 210px; padding: 24px 24px 18px;
      border: 1px solid var(--hb-line); border-radius: 24px;
      background: var(--hb-card);
      box-shadow: 0 16px 40px rgba(18,128,128,.10), 0 2px 6px rgba(18,50,54,.04);
      transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease);
      animation: honor-in .5s var(--ease) both;
      animation-delay: calc(var(--stagger, 0) * 65ms);
    }
    .honor-card:hover { transform: translateY(-3px); border-color: #A9DCD6; box-shadow: 0 22px 54px rgba(18,128,128,.16); }
    .honor-card::after {
      content: ""; position: absolute; top: -84px; right: -54px;
      width: 220px; height: 220px; border-radius: 50%;
      background: radial-gradient(circle, rgba(26,163,163,.14), transparent 68%);
      pointer-events: none;
    }
    @keyframes honor-in { from { opacity: 0; transform: translateY(18px); } }
    .honor-card-top { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; margin-bottom: 15px; }
    .honor-avatar {
      display: grid; place-items: center; flex: none;
      width: 42px; height: 42px; border-radius: 14px;
      color: #fff; font: 700 15px var(--font-head);
      background: linear-gradient(135deg, #1AA3A3, #0B5F63);
      box-shadow: 0 7px 18px rgba(18,128,128,.22);
    }
    .honor-author { font-size: 14px; font-weight: 800; }
    .honor-time { margin-top: 1px; color: var(--hb-muted); font-size: 12px; }
    .honor-text {
      position: relative; z-index: 1;
      margin: 0; color: var(--hb-text);
      font-size: clamp(17px, 2.4vw, 22px); line-height: 1.5;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .honor-actions { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; margin-top: 24px; }
    .honor-like {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 17px; border: 1px solid #CFE7E4; border-radius: 999px;
      background: #F5FCFB; color: var(--hb-teal-dark);
      font: 700 14px var(--font-body); cursor: pointer;
      transition: transform .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease);
    }
    .honor-like:hover { transform: translateY(-1px); border-color: #8CCFC8; background: var(--hb-mint); }
    .honor-like svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; transition: fill .18s; }
    .honor-like.is-liked { color: #fff; border-color: transparent; background: linear-gradient(135deg, #1AA3A3, #0B5F63); }
    .honor-like.is-liked svg { fill: currentColor; }
    .honor-like:disabled { opacity: .55; cursor: wait; }
    .honor-like.is-popping { animation: like-pop .28s var(--ease); }
    .honor-like.is-popping svg { animation: heart-pop .28s var(--ease); }
    @keyframes like-pop { 45% { transform: scale(1.14); } }
    @keyframes heart-pop { 45% { transform: scale(1.32) rotate(-8deg); } }
    .honor-skeleton { display: grid; gap: 18px; }
    .honor-skeleton-card {
      min-height: 210px; border-radius: 24px;
      background: linear-gradient(105deg, #E7F4F2 24%, #F8FEFD 48%, #E7F4F2 72%);
      background-size: 220% 100%;
      animation: honor-shimmer 1.15s linear infinite;
    }
    @keyframes honor-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
    .honor-like:focus-visible, .honor-login:focus-visible, .honor-card a:focus-visible {
      outline: 3px solid #49BDB4; outline-offset: 3px;
    }
    .honor-empty {
      padding: 42px 24px; border: 1px dashed #A9DCD6; border-radius: 22px;
      background: rgba(255,255,255,.62); color: var(--hb-muted); text-align: center;
    }
    .honor-note { margin-top: 16px; color: #789094; font-size: 12px; text-align: center; }
    .honor-login { color: var(--hb-teal); text-decoration: underline; text-underline-offset: 3px; }
    @media (max-width: 640px) {
      .honor-main { padding: 20px 12px 64px; }
      .honor-card { min-height: 190px; padding: 20px 18px 16px; border-radius: 20px; }
      .honor-skeleton-card { min-height: 190px; border-radius: 20px; }
      .honor-hero h1 { font-size: clamp(29px, 9vw, 38px); }
    }
    @media (max-width: 375px) {
      .honor-main { padding-left: 10px; padding-right: 10px; }
      .honor-hero { padding-top: 8px; }
      .honor-hero h1 { font-size: 28px; }
      .honor-card { border-radius: 18px; padding: 18px 15px 14px; }
      .honor-like { padding: 9px 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .honor-card, .honor-like, .honor-like svg, .honor-skeleton-card { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body class="honor-page">

  <header class="site-header" id="site-header">
    <a class="brand" href="index.html">
      <img src="assets/img/logo-120.png" alt="Эмблема НЭЛ" width="38" height="38">
      <span class="brand-name">ГДЗ НЭЛ</span>
    </a>
    <nav class="site-nav" aria-label="Разделы сайта">
      <a href="index.html#subjects">Предметы</a>
      <a href="honor.html" aria-current="page">Доска почёта</a>
      <a href="about.html">О проекте</a>
    </nav>
    <div class="header-actions">
      <span class="auth-slot" data-auth-slot>
        <a class="btn btn-outline btn-sm auth-btn" href="auth.html">
          <span class="icon i-user" aria-hidden="true"></span>
          <span class="btn-label">Войти</span>
        </a>
      </span>
      <a class="btn btn-primary btn-sm" href="app/index.html">
        <span class="icon i-book" aria-hidden="true"></span>
        <span class="btn-label">Открыть приложение</span>
      </a>
    </div>
  </header>

  <main class="honor-main">
    <section class="honor-hero">
      <span class="honor-kicker">Доска почёта</span>
      <h1>Что говорят о нас</h1>
      <p>Благодарности, объявления и лучшие моменты проекта. Писать может только администратор, а лайкать — каждый.</p>
    </section>

    <div class="honor-feed" id="honor-feed" aria-live="polite" aria-busy="true">
      <div class="honor-skeleton" aria-hidden="true">
        <div class="honor-skeleton-card"></div>
        <div class="honor-skeleton-card"></div>
        <div class="honor-skeleton-card"></div>
      </div>
    </div>
    <p class="honor-note" id="honor-note">Лайки сохраняются в аккаунте. Без входа можно только читать.</p>
  </main>

  <script type="module">
    import { supabase, getSession, escapeHtml, initHeaderAuth } from './assets/supabase.js';
    initHeaderAuth({ authHref: 'auth.html', profileHref: 'profile.html' });

    var feed = document.getElementById('honor-feed');
    var note = document.getElementById('honor-note');
    var session = await getSession();
    var liked = new Set();
    var posts = [];

    function relTime(iso) {
      var t = new Date(iso).getTime();
      if (!Number.isFinite(t)) return '';
      var s = Math.max(1, Math.floor((Date.now() - t) / 1000));
      if (s < 60) return 'только что';
      if (s < 3600) {
        var m = Math.floor(s / 60);
        return m + ' ' + (m === 1 ? 'минуту' : m < 5 ? 'минуты' : 'минут') + ' назад';
      }
      if (s < 86400) {
        var h = Math.floor(s / 3600);
        return h + ' ' + (h === 1 ? 'час' : h < 5 ? 'часа' : 'часов') + ' назад';
      }
      var d = Math.floor(s / 86400);
      if (d < 7) return d + ' ' + (d === 1 ? 'день' : d < 5 ? 'дня' : 'дней') + ' назад';
      return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    }

    function cardHtml(post, index) {
      var isLiked = liked.has(String(post.id));
      return '<article class="honor-card" data-id="' + post.id + '" style="--stagger:' + Math.min(index, 10) + '">' +
        '<div>' +
          '<div class="honor-card-top">' +
            '<span class="honor-avatar" aria-hidden="true">А</span>' +
            '<div><div class="honor-author">Аноним</div>' +
            '<div class="honor-time">' + escapeHtml(relTime(post.created_at)) + '</div></div>' +
          '</div>' +
          '<p class="honor-text">' + escapeHtml(post.text) + '</p>' +
        '</div>' +
        '<div class="honor-actions">' +
          '<button class="honor-like' + (isLiked ? ' is-liked' : '') + '" type="button" data-like="' + post.id + '"' +
            ' aria-pressed="' + String(isLiked) + '" aria-label="Поставить лайк">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg>' +
            '<span data-count>' + Number(post.likes || 0) + '</span>' +
          '</button>' +
        '</div>' +
      '</article>';
    }

    function render() {
      if (!posts.length) {
        feed.removeAttribute('aria-busy');
        feed.innerHTML = '<div class="honor-empty">Пока пусто. Администратор скоро что-нибудь напишет.</div>';
        return;
      }
      feed.removeAttribute('aria-busy');
      feed.innerHTML = posts.map(cardHtml).join('');
    }

    async function loadLikes() {
      if (!session) return;
      var res = await supabase.from('honor_likes').select('post_id');
      if (!res.error) (res.data || []).forEach(function (x) { liked.add(String(x.post_id)); });
    }

    async function load() {
      var res = await supabase.from('honor_board')
        .select('id, text, likes, created_at')
        .order('created_at', { ascending: false })
        .limit(60);
      if (res.error) {
        feed.removeAttribute('aria-busy');
        feed.innerHTML = '<div class="honor-empty">Не удалось загрузить ленту. Обнови страницу.</div>';
        return;
      }
      posts = res.data || [];
      await loadLikes();
      render();
      if (!session && posts.length) {
        note.innerHTML = 'Лайки сохраняются в аккаунте. <a class="honor-login" href="auth.html?next=honor.html">Войди</a>, чтобы ставить сердечки.';
      }
    }

    feed.addEventListener('click', async function (event) {
      var btn = event.target.closest('[data-like]');
      if (!btn) return;
      if (!session) {
        location.href = 'auth.html?next=' + encodeURIComponent('honor.html');
        return;
      }
      var id = btn.getAttribute('data-like');
      btn.disabled = true;
      var res = await supabase.rpc('honor_like', { p_id: Number(id) });
      btn.disabled = false;
      if (res.error) {
        note.textContent = 'Не получилось поставить лайк. Попробуй ещё раз.';
        return;
      }
      var row = Array.isArray(res.data) ? res.data[0] : res.data;
      if (!row) return;
      var post = posts.find(function (p) { return String(p.id) === id; });
      if (post) post.likes = row.total_likes;
      if (row.liked) liked.add(id); else liked.delete(id);
      btn.classList.toggle('is-liked', !!row.liked);
      btn.setAttribute('aria-pressed', String(!!row.liked));
      var count = btn.querySelector('[data-count]');
      if (count) count.textContent = String(row.total_likes);
      btn.classList.remove('is-popping');
      void btn.offsetWidth;
      btn.classList.add('is-popping');
      setTimeout(function () { btn.classList.remove('is-popping'); }, 320);
      note.textContent = 'Лайки сохраняются в аккаунте.';
    });

    load();
  </script>
</body>
</html>
