<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ГДЗ НЭЛ — приложение</title>
  <meta name="description" content="Приложение ГДЗ НЭЛ: готовые домашние задания для 3–11 классов лицея. Поиск по номеру и тексту, избранное, история, отзывы, решение по фото, тёмная тема, офлайн-режим.">
  <meta name="robots" content="index, follow">

  <!-- домен-плейсхолдер: заменить USER после деплоя (см. docs/CHANGELOG.md) -->
  <link rel="canonical" href="https://gdz-nel.pages.dev/app/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ГДЗ НЭЛ">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="ГДЗ НЭЛ — приложение для 3–11 классов">
  <meta property="og:description" content="Условия, пошаговые решения и ответы. Поиск, избранное, офлайн.">
  <meta property="og:image" content="https://gdz-nel.pages.dev/assets/img/screens/og-1200x630.png">
  <meta property="og:url" content="https://gdz-nel.pages.dev/app/">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../assets/img/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1AA3A3">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- шрифты не блокируют рендер: грузим как print и переключаем на all -->
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <header class="app-header" id="app-header">
    <div class="read-progress" id="read-progress" aria-hidden="true"></div>
    <div class="header-row">
      <a class="brand" href="../index.html">
        <img src="../assets/img/logo-120.png" alt="Эмблема НЭЛ" width="36" height="36">
        <span class="brand-name">ГДЗ НЭЛ</span>
      </a>

      <div class="header-search" id="header-search">
        <span class="icon i-search" aria-hidden="true"></span>
        <input id="search-input" type="search" placeholder="Номер или текст задания"
               autocomplete="off" aria-label="Поиск по заданиям">
        <button class="search-clear" id="search-clear" type="button" aria-label="Очистить поиск" hidden>
          <span class="icon i-close" aria-hidden="true"></span>
        </button>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="search-toggle" type="button" aria-label="Открыть поиск">
          <span class="icon i-search" aria-hidden="true"></span>
        </button>
        <a class="icon-btn" href="#/favorites" aria-label="Избранное">
          <span class="icon i-star" aria-hidden="true"></span>
        </a>
        <a class="icon-btn" href="#/recent" aria-label="Недавние">
          <span class="icon i-clock" aria-hidden="true"></span>
        </a>
        <a class="icon-btn" href="../photo.html" aria-label="Решить по фото">
          <span class="icon i-camera" aria-hidden="true"></span>
        </a>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Переключить тему">
          <span class="icon i-moon" aria-hidden="true"></span>
        </button>
        <span class="auth-slot" data-auth-slot>
          <a class="icon-btn" href="../auth.html?next=app/index.html" aria-label="Войти">
            <span class="icon i-user" aria-hidden="true"></span>
          </a>
        </span>
        <a class="icon-btn" href="../index.html" aria-label="На главную">
          <span class="icon i-home" aria-hidden="true"></span>
        </a>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div id="screen" class="screen" aria-live="polite"></div>
  </main>

  <!-- офлайн-плашка (Ф15) -->
  <div class="offline-bar no-print" id="offline-bar" hidden role="status">
    <span class="icon i-alert" aria-hidden="true"></span>
    <span>Нет подключения — показываю данные из кэша</span>
  </div>

  <!-- обновление приложения (Ф15.8) -->
  <div class="sw-update no-print" id="sw-update" hidden role="status">
    <span>Доступна новая версия</span>
    <button class="btn btn-primary btn-sm" id="sw-update-btn" type="button">
      <span class="icon i-refresh" aria-hidden="true"></span><span>Обновить</span>
    </button>
  </div>

  <!-- кнопка «наверх» (Ф3.9) -->
  <button class="to-top no-print" id="to-top" type="button" hidden aria-label="Наверх">
    <span class="icon i-arrow-up" aria-hidden="true"></span>
  </button>

  <!-- нижняя навигация на телефоне (Ф14) -->
  <nav class="bottom-nav no-print" id="bottom-nav" aria-label="Навигация приложения">
    <a class="bottom-nav-item" href="#/" data-nav="home">
      <span class="icon i-home" aria-hidden="true"></span><span>Классы</span></a>
    <a class="bottom-nav-item" href="#/favorites" data-nav="favorites">
      <span class="icon i-star" aria-hidden="true"></span><span>Избранное</span></a>
    <a class="bottom-nav-item" href="#/recent" data-nav="recent">
      <span class="icon i-clock" aria-hidden="true"></span><span>Недавние</span></a>
    <button class="bottom-nav-item" type="button" id="nav-search">
      <span class="icon i-search" aria-hidden="true"></span><span>Поиск</span></button>
    <a class="bottom-nav-item" href="../profile.html">
      <span class="icon i-user" aria-hidden="true"></span><span>Профиль</span></a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="hint" class="hint" role="region" aria-label="Подсказка о навигации" hidden>
    <p><strong>Подсказка:</strong> клавиши <kbd>←</kbd> и <kbd>→</kbd> переключают задания, <kbd>Esc</kbd> возвращает к списку. На телефоне работают свайпы.</p>
    <button class="btn btn-outline btn-sm" id="hint-close" type="button"><span>Понятно</span></button>
  </div>

  <script type="application/ld+json" id="task-jsonld">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "ГДЗ НЭЛ — готовые домашние задания",
    "url": "https://gdz-nel.pages.dev/app/",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Any",
    "inLanguage": "ru",
    "description": "Условия, пошаговые решения и ответы для 3–11 классов Новосибирского экономического лицея.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "RUB"
    }
  }
  </script>
  <script src="../assets/analytics.js" defer></script>
  <script src="assets/script.js"></script>
  <script type="module">
    // Мост к Supabase: script.js ждёт window.gdzSupabase (или событие ниже).
    // Если модуль не загрузился (офлайн) — в шапке остаётся статичная кнопка «Войти»,
    // отзывы и решение по фото недоступны с понятным сообщением.
    import { supabase, getSession, getProfile, avatarColor, escapeHtml, isPremiumActive, initHeaderAuth } from '../assets/supabase.js';

    initHeaderAuth({
      authHref: '../auth.html?next=app/index.html',
      profileHref: '../profile.html',
      variant: 'icon'
    });

    window.gdzSupabase = {
      supabase: supabase,
      getSession: getSession,
      getProfile: getProfile,
      avatarColor: avatarColor,
      escapeHtml: escapeHtml,
      isPremiumActive: isPremiumActive
    };
    window.dispatchEvent(new Event('gdz-supabase-ready'));
  </script>
</body>
</html>
