# ГДЗ НЭЛ — конфиг Supabase CLI.
# project_id нужен локальному стеку; для деплоя — `supabase link --project-ref qncqeoklwblztbnoktwk`.

project_id = "qncqeoklwblztbnoktwk"

# moderate-review вызывает база (вебхук pg_net) — JWT не передаётся.
[functions.moderate-review]
verify_jwt = false

# solve-photo вызывает браузер залогиненного пользователя — JWT обязателен.
[functions.solve-photo]
verify_jwt = true

# ИИ-репетитор: только для залогиненных, ключ Groq остаётся на сервере.
[functions.ai-tutor]
verify_jwt = true

# request_logs: вызывается и для гостей, JWT не обязателен.
[functions.log-request]
verify_jwt = false

# lava-webhook зовёт сервис оплаты Lava.top — JWT у него нет,
# защита — подпись тела (секрет LAVA_WEBHOOK_SECRET).
[functions.lava-webhook]
verify_jwt = false
